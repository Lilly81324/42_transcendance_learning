<!DOCTYPE html>
<html>
  <head>
    <style>
      /* Set up the canvas to be using the whole page */
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
    <!-- This line loads BabylonJS, which allows usage of it -->
  </head>
  
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <!-- touch-action="none" for best results from PEP -->
    
    <!-- Get Earcut scripts for extruding Polygons -->
    <script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
    <!-- Babylon functions -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Havoc Phys Engine -->
     <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <!-- Main script -->
    <script type="module">
      function lock2D(mesh, body) {
        mesh.position.z = 0;

        const e = mesh.rotationQuaternion.toEulerAngles();
        mesh.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(0,0,e.z);

        body.body.setAngularVelocity(new BABYLON.Vector3(0,0,body.body.getAngularVelocity().z));
      }

      function createCamera(scene, canvas, pos_x = 0, pos_y = 0, max_distance = 8)
      {
        const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2, 10, new BABYLON.Vector3(0, 0, 0), scene);
        camera.position = new BABYLON.Vector3(pos_x, pos_y, -max_distance);
        camera.target  = new BABYLON.Vector3(pos_x, pos_y, 0);
        camera.attachControl(canvas, true, false);
        camera.wheelPrecision = 20;
        camera.minZ = 0.3

        // Minimum Distance of Camera to target
        camera.lowerRadiusLimit = 2
        // Maximum Distance of Camera to target
        camera.upperRadiusLimit = max_distance
        
        // No rotating Camera
        camera.angularSensibilityX = 200;
        camera.angularSensibilityY = 200;
        // Make right click pan camera
        camera.useBouncingBehavior = false;
        camera.fov = 1

        return (camera);
      }


      function createGround(scene)
      {
        const bottom = -1;
        const groundShape = [
          new BABYLON.Vector3(19, 0, bottom),
          new BABYLON.Vector3(19, 0, 6),
          new BABYLON.Vector3(15, 0, 6),
          new BABYLON.Vector3(14, 0, 3),
          new BABYLON.Vector3(13, 0, 1.5),
          new BABYLON.Vector3(11, 0, 1.5),
          new BABYLON.Vector3(9, 0, 3.2),
          new BABYLON.Vector3(6, 0, 3.25),
          new BABYLON.Vector3(5, 0, 3),
          new BABYLON.Vector3(4, 0, 2.5),
          new BABYLON.Vector3(3, 0, 1.75),
          new BABYLON.Vector3(2, 0, 1.25),
          new BABYLON.Vector3(1, 0, 1),
          new BABYLON.Vector3(0, 0, 1),
          new BABYLON.Vector3(0, 0, bottom)
        ];

        const ground = BABYLON.MeshBuilder.ExtrudePolygon("Ground_Box", {shape: groundShape, depth: 1}, scene);
        ground.rotation.x = -Math.PI / 2;
        ground.position = new BABYLON.Vector3(-9.5, 0, -0.5)

        const floorAggregate = new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.MESH, { mass: 0 }, scene);

        return (floorAggregate);
      }

      async function createScene(engine, canvas, scene) {

        // Setup Camera and Ligthing
        const camera = createCamera(scene, canvas, 0, 2, 13.5);

        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0));

        // Create Ground
        const ground = createGround(scene);

        await BABYLON.InitializeCSG2Async();

        const box = BABYLON.MeshBuilder.CreateBox("positive", {height: 3}, scene);
        box.position.y = 5;
        box.position.x = 8;
        box.setEnabled(false);

        const boxCSG = BABYLON.CSG2.FromMesh(box);
        const groundCSG = BABYLON.CSG2.FromMesh(scene.meshes[0]);

        const result = groundCSG.subtract(boxCSG);
        const resultMesh = result.toMesh("New Ground", scene);
        scene.meshes[0].dispose();
        boxCSG.dispose();
        groundCSG.dispose();
        box.dispose();
        ground.dispose();
        const newGroundAggr = new BABYLON.PhysicsAggregate(resultMesh, BABYLON.PhysicsShapeType.MESH, { mass: 0 }, scene);

        scene.beforeRender = function () {
          // Formula based on total zoom to determine width when zoomed in
          const width = camera.upperRadiusLimit * 0.74 -1.475;
          // Formula to calculate how zoomed in we are
          const zoom_ratio = (1- ((camera.radius - camera.lowerRadiusLimit) / (camera.upperRadiusLimit - camera.lowerRadiusLimit)));
          const xLimit = width * zoom_ratio;
          if (camera.target.x < -xLimit)
          camera.target.x = -xLimit;
          else if (camera.target.x > xLimit)
          camera.target.x = xLimit;
          }
      };

      // Test for Variable Resolution
      function registerMovement(scene, mesh, physObj)
      {
          let lastJumped = 0;

          scene.onKeyboardObservable.add(e => {
            if (e.event.key === "w") {
              if (Date.now() - lastJumped >= 1000)
              {
                lastJumped = Date.now();
                physObj.body.applyForce(new BABYLON.Vector3(0, 400, 0), mesh.getAbsolutePosition());
              }
            }
            const maxSpeed = 4;
            const accel = 30;
            const velocity = new BABYLON.Vector3(0, 0, 0);
            player.body.getLinearVelocityToRef(velocity);
            if (e.event.key === "a") {
              if (velocity.x > -maxSpeed)
              player.body.applyForce(new BABYLON.Vector3(-accel, 0, 0), box.getAbsolutePosition());
            }
            if (e.event.key === "d") {
              if (velocity.x < maxSpeed)
              player.body.applyForce(new BABYLON.Vector3(accel, 0, 0), box.getAbsolutePosition());
            }
          });
      }


      const canvas = document.getElementById("renderCanvas"); // Get the canvas element
      const engine = new BABYLON.Engine(canvas, true); // Generate the BABYLON 3D engine

      // Create meshes
      const scene = new BABYLON.Scene(engine);

      // Add Havoc Phys Engine and Gravity to scene
      const havokInstance = await HavokPhysics();
      const hk = new BABYLON.HavokPlugin(true, havokInstance);
      scene.enablePhysics(new BABYLON.Vector3(0, -9.8, 0), hk);

      // Set up Scene
      createScene(engine, canvas, scene);

      const box = new BABYLON.MeshBuilder.CreateBox("player", {height: 1.5,size: 0.5 }, scene);
      box.position = new BABYLON.Vector3(-1, 4, 0);

      const player = new BABYLON.PhysicsAggregate(
        box,
        BABYLON.PhysicsShapeType.BOX,
        { mass: 1, friction: 0.5 },
        scene);

      registerMovement(scene, box, player);

      // --- 2D LOCKING ---
      function test(scene, box, player)
      {
          let won = false;
          let lost = false;
          scene.onBeforeRenderObservable.add(() => {
                lock2D(box, player);
                if (!won && box.position.y < 1.8 && box.position.y > 1.5  && box.position.x > 7.5 && box.position.y < 8.5 )
                {
                  alert("Congratulations! You won!");
                  won = true;
                }
                if (!lost && box.position.y < -3)
                {
                  alert("You lost! Hit F5 to reload and try again.");
                  lost = true;
                }
          });
      }
      test(scene, box, player);

      // Register a render loop to repeatedly render the scene
      engine.runRenderLoop(function () {
        scene.render();
      });

      // Watch for browser/canvas resize events
      window.addEventListener("resize", function () {
        engine.resize();
      });
    </script>
    </script>
  </body>
</html>
