<!DOCTYPE html>
<html>
  <head>
    <style>
      /* Set up the canvas to be using the whole page */
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #headline {
        width: 100%;
        height: 10%;
        padding-left: 0;
        padding-right: 0;
        margin-left: auto;
        margin-right: auto;
        display: block;
        touch-action: none;
      }

      #renderCanvas {
        width: 100%;
        height: 90%;
        touch-action: none;
      }
    </style>
    <!-- This line loads BabylonJS, which allows usage of it -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://code.jquery.com/pep/0.4.3/pep.js"></script>
  </head>
  
  <body>

    <!-- Headline Text -->
    <canvas id="headline" touch-action="none"></canvas>
    <script src="headline.js"></script>

    <!-- BabylonJS Interface -->
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <script type="module" src="main.js"></script>
  </body>
</html>
