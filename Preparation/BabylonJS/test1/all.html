<!DOCTYPE html>
<html>
  <head>
    <style>
      /* Set up the canvas to be using the whole page */
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
    <!-- This line loads BabylonJS, which allows usage of it -->
  </head>
  
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <!-- touch-action="none" for best results from PEP -->
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>

	const burn = (scene, size, posVector) => {
		 // Create a particle system
		const particleSystem = new BABYLON.ParticleSystem("particles", 2000, scene);
		// Texture of each particle
		particleSystem.particleTexture = new BABYLON.Texture("https://www.pngarts.com/files/4/Sun-PNG-Free-Download.png");
		
		var boxEmitter = new BABYLON.Vector3(0, 0, 0);
		
		particleSystem.emitter = boxEmitter;
		particleSystem.createDirectedSphereEmitter(0.7, new BABYLON.Vector3(-0.2, 1, -0.2), new BABYLON.Vector3(0.3, 1, 0.3));

		// Make them oblong
		particleSystem.minScaleY = 1.0;
		particleSystem.maxScaleY = 3.0;

		// Make many
		particleSystem.emitRate = 1000;

		// Size of fire (unimportant)
		particleSystem.maxLifeTime = size

		// Speed of each particle (Intensity of Fire)
		particleSystem.minEmitPower = 0.0;
		particleSystem.maxEmitPower = 5.0;

		// Control size of fire
		particleSystem.addSizeGradient(0, 0.5);
		particleSystem.addSizeGradient(0.5, 0);

		// Graininess of fire
		particleSystem.addColorGradient(0.02, BABYLON.Color3.Red(), BABYLON.Color3.Yellow());
		particleSystem.addColorGradient(size * 0.8, BABYLON.Color3.Black());
		particleSystem.start();

		return (particleSystem);
	}
	
	function createScene(engine, canvas) {
		const scene = new BABYLON.Scene(engine);

		BABYLON.ImportMeshAsync("https://assets.babylonjs.com/meshes/box.babylon");

		const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 15, new BABYLON.Vector3(0, 0, 0));
		camera.attachControl(canvas, true);
		const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0));

		burn(scene, new BABYLON.Vector3(0, 0, 0));
		return scene;
	};

	const canvas = document.getElementById("renderCanvas"); // Get the canvas element
	const engine = new BABYLON.Engine(canvas, true); // Generate the BABYLON 3D engine

	// Add your code here matching the playground format
	const scene = createScene(engine, canvas); //Call the createScene function

	// Register a render loop to repeatedly render the scene
	engine.runRenderLoop(function () {
		scene.render();
	});

	// Watch for browser/canvas resize events
	window.addEventListener("resize", function () {
		engine.resize();
	});

	</script>
    </script>
  </body>
</html>
